
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin Login - CloudStore</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
        }

        .login-card {
            max-width: 420px;
            margin: 100px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="login-card">

        <h2 class="text-center mb-2">CloudStore</h2>

        <p class="text-center text-secondary mb-4">
            Administrator Login
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Username</label>

                <input type="text"
                       name="username"
                       class="form-control"
                       required>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>

                <input type="password"
                       name="password"
                       class="form-control"
                       required>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100">
                Login
            </button>

        </form>

        <div class="text-center mt-4">
            <a href="/">Back to Store</a>
        </div>

    </div>

</div>

</body>
</html>
