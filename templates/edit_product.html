
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Product - CloudStore</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm mx-auto" style="max-width:650px">

        <div class="card-header">
            <h4>Edit Product</h4>
        </div>

        <div class="card-body">

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="name"
                           class="form-control"
                           value="{{ product.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description"
                              class="form-control"
                              rows="3">{{ product.description or '' }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" name="category"
                           class="form-control"
                           value="{{ product.category or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Price (₹)</label>
                    <input type="number" name="price"
                           class="form-control"
                           step="0.01" min="0.01"
                           value="{{ product.price }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number" name="stock"
                           class="form-control"
                           min="0"
                           value="{{ product.stock }}" required>
                </div>
		<div class="mb-3">
    			<label class="form-label">Replace Product Image</label>
    			<input type="file"
           			name="image"
           			class="form-control"
           			accept=".jpg,.jpeg,.png,.webp">
    			<small class="text-muted">
        		Leave empty to keep the existing image. Maximum size: 5 MB.
    			</small>
		</div>

                <button type="submit" class="btn btn-primary w-100">
                    Update Product
                </button>

                <a href="/admin/dashboard"
                   class="btn btn-secondary w-100 mt-2">
                    Cancel
                </a>

            </form>

        </div>
    </div>
</div>

</body>
</html>
